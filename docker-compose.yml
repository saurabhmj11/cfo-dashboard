version: '3.8'

services:
  # Layer 2: Golden Data Store
  db:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: financial_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # The Monolith Revolution: All-in-one Backend
  backend:
    build: 
      context: .
      dockerfile: app/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/financial_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PAPERCLIP_URL=http://paperclip:3100
      - PAPERCLIP_COMPANY_ID=${PAPERCLIP_COMPANY_ID}
      - PAPERCLIP_AGENT_ID=${PAPERCLIP_AGENT_ID}
      - MONGODB_URL=mongodb://mongo:27017/refinery
    depends_on:
      db:
        condition: service_started
      paperclip:
        condition: service_healthy

  # Layer 6: Enterprise Experience
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  # Layer 7: Paperclip Orchestration Control Plane
  paperclip:
    build: 
      context: ../paperclip-master
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - paperclip_data:/paperclip
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  paperclip_data:
